[project]
name = "litigation-analytics"
version = "0.1.0"
description = "AI-assisted litigation outcome prediction for Kenyan courts"
requires-python = ">=3.10"
dependencies = [
    # Data & HTTP
    "requests>=2.31",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "tqdm>=4.66",

    # PDF extraction
    "pymupdf>=1.23",
    "pdfminer.six>=20221105",

    # NLP
    "spacy>=3.7",
    "sentence-transformers>=2.3",

    # ML
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "optuna>=3.4",
    "shap>=0.44",
    "mlflow>=2.9",

    # API
    "fastapi>=0.108",
    "uvicorn[standard]>=0.25",

    # Config
    "python-dotenv>=1.0",
    "pyyaml>=6.0",

    # Analysis & Visualization
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "statsmodels>=0.14",
    "scipy>=1.11",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "ruff>=0.1"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled separately

[tool.ruff.lint.isort]
known-first-party = ["src", "configs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
